Name: harbour-straumr
Summary: Straumr
Version: 0.9.0
Release: 1
Group: Qt/Qt
URL: https://github.com/storefyr/Straumr
License: LICENSE
Sources:
- '%{name}-%{version}.tar.bz2'
Description: |
  Straumr - viser elpriser i Sailfish OS begivenhedsvisningen.
  Viser den samlede elpris inkl. nettarif, Energinet-tariffer,
  elafgift og moms for Radius Elnet (DK2).
Configure: none
Builder: qmake5

PkgConfigBR:
  - sailfishapp >= 1.0.2
  - Qt5Core
  - Qt5Qml
  - Qt5Quick
  - Qt5Network

Requires:
  - sailfishsilica-qt5 >= 0.10.9

Files:
  - '%{_bindir}'
  - '%{_datadir}/%{name}'
  - '%{_datadir}/applications/%{name}.desktop'
  - '%{_datadir}/icons/hicolor/*/apps/%{name}.png'
