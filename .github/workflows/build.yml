name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RELEASE: 5.2.0.15

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging YAML
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import yaml
          for f in ('rpm/harbour-straumr.yaml',):
              d = yaml.safe_load(open(f))
              assert d['Name'] == 'harbour-straumr', d['Name']
              assert d['Builder'] == 'qmake5'
              print(f, 'OK:', d['Name'], d['Version'])
          EOF

      - name: Validate QML files
        run: |
          python3 - <<'EOF'
          import glob
          for f in glob.glob('qml/**/*.qml', recursive=True):
              text = open(f).read()
              assert text.count('{') == text.count('}'), f'unbalanced braces in {f}'
              print(f, 'OK')
          EOF

      - name: Validate desktop file (incl. SailJail)
        run: |
          python3 - <<'EOF'
          import re
          content = open('harbour-straumr.desktop').read()
          assert re.search(r'^Exec=harbour-straumr$', content, re.M), 'Exec must be bare binary name'
          assert re.search(r'^Icon=harbour-straumr$', content, re.M), 'missing Icon'
          assert not re.search(r'^\[Sailjail\]$', content, re.M), '[Sailjail] not allowed, use [X-Sailjail]'
          m = re.search(r'^\[X-Sailjail\]$(.*?)(?=^\[|\Z)', content, re.M | re.S)
          assert m, 'missing [X-Sailjail] section'
          keys = {}
          for line in m.group(1).strip().split('\n'):
              line = line.strip()
              if line and not line.startswith('#'):
                  k, _, v = line.partition('=')
                  keys[k] = v
          assert 'OrganizationName' in keys, 'missing OrganizationName'
          assert 'ApplicationName' in keys, 'missing ApplicationName'
          assert re.match(r'^[0-9a-z._-]+$', keys['OrganizationName']), 'bad OrganizationName'
          assert re.match(r'^[A-Za-z_-][A-Z0-9a-z_-]*$', keys['ApplicationName']), 'bad ApplicationName'
          allowed_perms = {'Audio','Bluetooth','Camera','Internet','Location','MediaIndexing',
              'Microphone','NFC','RemovableMedia','UserDirs','WebView','Documents',
              'Downloads','Music','Pictures','PublicDir','Videos','Compatibility',
              'Secrets','Contacts','Accounts'}
          if 'Permissions' in keys:
              for p in keys['Permissions'].split(';'):
                  p = p.strip()
                  if p:
                      assert p in allowed_perms, f'permission not allowed in Harbour: {p}'
          print('desktop file OK (SailJail validated)')
          EOF

      - name: Validate icons
        run: |
          python3 - <<'EOF'
          import struct, glob
          for f in sorted(glob.glob('icons/*/harbour-straumr.png')):
              with open(f, 'rb') as fh:
                  data = fh.read(33)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f
              w, h = struct.unpack('>II', data[16:24])
              size = int(f.split('/')[1].split('x')[0])
              assert w == h == size, f'{f}: {w}x{h} != {size}'
              print(f, f'OK ({w}x{h})')
          EOF

  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7hl, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.RELEASE }}
          arch: ${{ matrix.arch }}

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: RPMS/*.rpm
