name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RELEASE: 5.2.0.15

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging YAML
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import yaml
          for f in ('rpm/harbour-straumr.yaml',):
              d = yaml.safe_load(open(f))
              assert d['Name'] == 'harbour-straumr', d['Name']
              assert d['Builder'] == 'qmake5'
              print(f, 'OK:', d['Name'], d['Version'])
          EOF

      - name: Validate QML files
        run: |
          python3 - <<'EOF'
          import glob
          for f in glob.glob('qml/**/*.qml', recursive=True):
              text = open(f).read()
              assert text.count('{') == text.count('}'), f'unbalanced braces in {f}'
              print(f, 'OK')
          EOF

      - name: Validate desktop file
        run: |
          test -s harbour-straumr.desktop
          grep -q '^Exec=harbour-straumr$' harbour-straumr.desktop
          grep -q '^Icon=harbour-straumr$' harbour-straumr.desktop
          echo 'desktop file OK'

      - name: Validate icons
        run: |
          python3 - <<'EOF'
          import struct, glob
          for f in sorted(glob.glob('icons/*/harbour-straumr.png')):
              with open(f, 'rb') as fh:
                  data = fh.read(33)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f
              w, h = struct.unpack('>II', data[16:24])
              size = int(f.split('/')[1].split('x')[0])
              assert w == h == size, f'{f}: {w}x{h} != {size}'
              print(f, f'OK ({w}x{h})')
          EOF

  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7hl, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.RELEASE }}
          arch: ${{ matrix.arch }}

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: RPMS/*.rpm
