name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  RELEASE: 5.2.0.15

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging YAML
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import yaml
          for f in ('rpm/harbour-straumr.yaml', 'widget/rpm/harbour-straumr-widget.yaml'):
              d = yaml.safe_load(open(f))
              assert d['Builder'] in ('qmake5', 'none'), d['Builder']
              print(f, 'OK:', d['Name'], d['Version'])
          EOF

      - name: Validate QML files
        run: |
          python3 - <<'EOF'
          import glob
          for f in glob.glob('qml/**/*.qml', recursive=True):
              text = open(f).read()
              assert text.count('{') == text.count('}'), f'unbalanced braces in {f}'
              print(f, 'OK')
          EOF

      - name: Validate desktop file (incl. SailJail)
        run: |
          python3 - <<'EOF'
          import re
          content = open('harbour-straumr.desktop').read()
          assert re.search(r'^Exec=harbour-straumr$', content, re.M), 'Exec must be bare binary name'
          assert re.search(r'^Icon=harbour-straumr$', content, re.M), 'missing Icon'
          assert not re.search(r'^\[Sailjail\]$', content, re.M), '[Sailjail] not allowed, use [X-Sailjail]'
          m = re.search(r'^\[X-Sailjail\]$(.*?)(?=^\[|\Z)', content, re.M | re.S)
          assert m, 'missing [X-Sailjail] section'
          keys = {}
          for line in m.group(1).strip().split('\n'):
              line = line.strip()
              if line and not line.startswith('#'):
                  k, _, v = line.partition('=')
                  keys[k] = v
          assert 'OrganizationName' in keys, 'missing OrganizationName'
          assert 'ApplicationName' in keys, 'missing ApplicationName'
          assert re.match(r'^[0-9a-z._-]+$', keys['OrganizationName']), 'bad OrganizationName'
          assert re.match(r'^[A-Za-z_-][A-Z0-9a-z_-]*$', keys['ApplicationName']), 'bad ApplicationName'
          allowed_perms = {'Audio','Bluetooth','Camera','Internet','Location','MediaIndexing',
              'Microphone','NFC','RemovableMedia','UserDirs','WebView','Documents',
              'Downloads','Music','Pictures','PublicDir','Videos','Compatibility',
              'Secrets','Contacts','Accounts'}
          if 'Permissions' in keys:
              for p in keys['Permissions'].split(';'):
                  p = p.strip()
                  if p:
                      assert p in allowed_perms, f'permission not allowed in Harbour: {p}'
          print('desktop file OK (SailJail validated)')
          EOF

      - name: Validate icons
        run: |
          python3 - <<'EOF'
          import struct, glob
          for f in sorted(glob.glob('icons/*/harbour-straumr.png')):
              with open(f, 'rb') as fh:
                  data = fh.read(33)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f
              w, h = struct.unpack('>II', data[16:24])
              size = int(f.split('/')[1].split('x')[0])
              assert w == h == size, f'{f}: {w}x{h} != {size}'
              print(f, f'OK ({w}x{h})')
          EOF

  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7hl, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: coderus/github-sfos-build@master
        with:
          release: ${{ env.RELEASE }}
          arch: ${{ matrix.arch }}

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: RPMS/*.rpm

  build-widget:
    name: Build widget RPM (noarch)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build widget RPM
        run: |
          mkdir -p widget/RPMS
          chmod 777 widget/RPMS
          docker run --rm --privileged \
            -v $GITHUB_WORKSPACE:/workspace \
            -e RELEASE=${{ env.RELEASE }} \
            -e ARCH=aarch64 \
            coderus/sailfishos-platform-sdk:${{ env.RELEASE }} \
            /bin/bash -c '
              set -ex
              mkdir -p /home/mersdk/build
              cd /home/mersdk/build
              cp -r /workspace/widget .
              cd widget
              mb2 -t SailfishOS-${RELEASE}-aarch64 build
              mkdir -p /workspace/widget/RPMS
              cp -r RPMS/*.rpm /workspace/widget/RPMS/
            '

      - name: Upload widget RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpms-widget
          path: widget/RPMS/*.rpm

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-widget]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: rpms
          merge-multiple: true

      - name: Create Release with RPMs
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
          generate_release_notes: true
          body: |
            ## Installation

            Download de RPM'er der passer til din telefon:

            | Fil | Til enhed |
            |-----|-----------|
            | `harbour-straumr-${{ github.ref_name }}-1.aarch64.rpm` | Jolla Phone 2026, Xperia 10 III/IV/V |
            | `harbour-straumr-${{ github.ref_name }}-1.armv7hl.rpm` | Ældre telefoner (Jolla 1, C, Xperia X) |
            | `harbour-straumr-widget-${{ github.ref_name }}-1.noarch.rpm` | Events View widget (alle enheder) |

            Installer på telefonen (begge RPM'er — widget-RPM'en aktiverer widgetten i begivenhedsvisningen):
            ```
            devel-su
            pkcon install local ~/Downloads/harbour-straumr-*-1.aarch64.rpm ~/Downloads/harbour-straumr-widget-*-1.noarch.rpm
            ```

            Genstart derefter telefonen, gå til **Indstillinger → Begivenhedsvisning** og slå Straumr til.
